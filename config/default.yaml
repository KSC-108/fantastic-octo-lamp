# Default configuration. Every key is optional; omitted keys use the defaults in src/octoquant/config.py.
# Data source is SYNTHETIC here so the project runs anywhere. Use config/nse.yaml for real NSE data.
data:
  source: synthetic

runtime:
  initial_equity: 1000000        # rupees, paper account
  run_after_ist: "16:10"         # daily job runs after this IST time on trading days
  holidays: []                   # ISO dates the operator must maintain, e.g. ["2026-10-02"]

risk:                            # hard limits, enforced in code, never editable by a model
  max_position_pct: 0.10
  max_positions: 8
  max_gross_pct: 0.80
  daily_loss_limit_pct: 0.02
  max_drawdown_pct: 0.15
  manual_approval_above: 250000

gates:                           # acceptance gates on the held-out test window
  min_sharpe: 1.5
  max_drawdown: 0.15
  min_hit_rate: 0.55
  min_tstat: 2.0
  min_test_years: 2.0
  min_trades: 100

costs:                           # ASSUMPTIONS: verify against your broker's contract note
  stt_pct: 0.001
  exchange_txn_pct: 0.0000297
  sebi_pct: 0.000001
  stamp_buy_pct: 0.00015
  gst_pct: 0.18
  dp_charge_sell: 13.5
  slippage_bps: 5

options:                         # index options backtest and paper book (`octoquant options ...`)
  source: model                  # model (Black-Scholes on the underlying) or bhavcopy (NSE F&O files)
  chain_dir: data/options        # bhavcopy CSVs, old or UDiFF format, any number of days
  underlying_csv: null           # optional: date, open, high, low, close[, vix]
  underlying: NIFTY
  lot_size: 75                   # ASSUMPTION: NSE revises lot sizes; check the current circular
  strike_step: 50
  expiry_weekday: 1              # model chain only (0 = Monday). ASSUMPTION: NIFTY weekly on Tuesday
  paper_enabled: false           # true: `serve` also steps the options paper book each trading day
  strategy:
    name: iron_condor            # see `octoquant options strategies`
    width_steps: 4
    wing_steps: 4
    entry_dte: 7
    stop_loss_mult: 1.5
    take_profit_pct: 0.6
  risk:
    initial_capital: 1000000
    risk_per_trade_pct: 0.02
    max_margin_pct: 0.50
    max_drawdown_pct: 0.25
