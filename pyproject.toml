[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "octoquant"
version = "0.1.0"
description = "Risk-first research and paper-trading system for NSE equities"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0",
  "pandas>=3.0",
  "scikit-learn>=1.4",
  "pydantic>=2.5",
  "pyyaml>=6.0",
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "httpx>=0.26",
  "joblib>=1.3",
]

[project.optional-dependencies]
nse = ["jugaad-data>=0.29"]
llm = ["anthropic>=0.40"]
dev = ["pytest>=8", "ruff>=0.4"]

[project.scripts]
octoquant = "octoquant.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
octoquant = ["runtime/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-q -m 'not slow'"
markers = ["slow: full-size harness validation, minutes to run"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501", "E741"]
